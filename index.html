<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Notepad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="lock" class="lock" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
    <button id="unlock" type="submit">Open</button>
    <p id="lock-message" class="lock-message" role="alert"></p>
  </form>

  <main hidden>
    <textarea id="pad" maxlength="10000" spellcheck="true" autocomplete="off"
              aria-label="Notepad" placeholder="Start typing…"></textarea>
  </main>
  <footer hidden>
    <span id="status" class="status" data-state="connecting" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Connecting…</span>
    </span>
    <span id="count" class="count">0 / 10,000</span>
  </footer>

  <script src="config.js"></script>
  <script src="merge.js"></script>
  <script src="app.js"></script>
</body>
</html>
